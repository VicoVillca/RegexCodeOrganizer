<div class="code-output">
  <div class="output-header" *ngIf="result">
    <h4></h4>
    
    <div >
      <button pButton 
              icon="pi pi-copy" 
              label="Copiar"
              (click)="copyToClipboard()">
      </button>
    </div>
  </div>

  <div *ngIf="!result" class="empty-state">
    <i class="pi pi-inbox"></i>
    <p>Ingresa código y haz click en "Ordenar Código"</p>
  </div>

  <div *ngIf="result">
    <pre><code #codeElement class="language-java">{{ result.organizedCode }}</code></pre>
    
    <div class="stats" *ngIf="result.stats">
      <div class="stat-item">
        <span>Tiempo: {{ getProcessingTime() }}ms</span>
      </div>
      <div class="stat-item">
        <span>Líneas: {{ getLineCount() }}</span>
      </div>
      <div class="stat-item" *ngIf="getLinesReduced() > 0">
        <span>Reducción: {{ getLinesReduced() }} líneas</span>
      </div>
    </div>
  </div>
</div>
