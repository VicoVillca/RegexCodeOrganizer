<div class="organizer-page">
  <header class="page-header">
    <h1>🔧 RegexCodeOrganizer</h1>
    <p>Organiza tu código Java automáticamente</p>
  </header>

  <div class="grid">
    <div class="col-12 md:col-6">
      <div class="card input-card">
        <app-code-input 
          [(code)]="inputCode"
          (codeChange)="onCodeChange($event)"
          (limpiarPanel)="limpiarPanel()">
        </app-code-input>
      </div>
    </div>

    <div class="col-12 md:col-6">
      <div class="card result-card">
        <app-code-output [result]="result"></app-code-output>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    <p>RegexCodeOrganizer • Proyecto de Portfolio • 2024</p>
  </footer>

  <p-toast position="top-right"></p-toast>
</div>
